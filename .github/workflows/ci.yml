# Integración continua de Tairos.rc: reproduce en limpio lo que se hace en local
# (tipos, pruebas de humo y build) para que nada llegue roto a la rama principal
# ni a un despliegue.
name: CI

on:
  push:
  pull_request:

# Sólo lectura: el flujo no publica nada, únicamente comprueba.
permissions:
  contents: read

# Si se empujan dos commits seguidos a la misma rama, cancela el primero.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # La misma versión que package.json (engines) y Netlify: Node 24 LTS.
      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # `npm ci` (y no `npm install`) porque instala exactamente lo que dice
      # package-lock.json, no lo toca, y falla si el lock y package.json han
      # divergido. Es lo que se quiere en un entorno de integración.
      - name: Instalar dependencias
        run: npm ci

      # esbuild (que usa `npm run smoke`, y Vite por dentro) trae un binario nativo
      # que se coloca en su script postinstall. npm 11.6+ bloquea por defecto los
      # scripts de instalación de las dependencias y sólo deja un aviso
      # ("blocked install scripts"), con lo que el fallo aparecería mucho después y
      # con un mensaje confuso. Si el binario ya está (lo normal: llega como
      # dependencia opcional @esbuild/linux-x64), este paso pasa de largo en un
      # segundo; si no, `npm rebuild esbuild` ejecuta el script sólo para ese
      # paquete. Es idempotente y evita tener que recurrir a `npm install`, que
      # sí modificaría el lock.
      - name: Asegurar el binario de esbuild
        run: npx --no-install esbuild --version || npm rebuild esbuild

      # La app y también los scripts (pruebas, evaluador, activación).
      - name: Comprobar tipos
        run: npm run typecheck

      # La Edge Function corre en Deno e importa con `npm:`: tsc no la revisa.
      - name: Preparar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar la Edge Function
        run: deno check supabase/functions/extraer-dictado/index.ts

      - name: Pruebas de humo
        run: npm run smoke

      # Build sin VITE_SUPABASE_* a propósito: comprueba que la app compila y que
      # el "modo local" (datos en localStorage) sigue siendo una salida válida.
      # OJO: este artefacto NO sirve para desplegar, porque Vite incrusta las
      # variables en tiempo de compilación; el host debe compilar con las suyas.
      - name: Compilar
        run: npm run build

      # La CSP de vercel.json/netlify.toml permite el script en línea de
      # index.html por su huella: si alguien lo cambia, esto falla aquí y no en
      # el navegador de quien usa la app.
      - name: Comprobar la política de contenido
        run: node scripts/csp.mjs
